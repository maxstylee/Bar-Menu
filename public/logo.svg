<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#amberGrad)" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="100" cy="100" r="82" fill="#131b2a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Stylized Cocktail & Diamond Icon -->
  <path d="M70 70 L130 70 L100 110 Z" fill="none" stroke="url(#amberGrad)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  <line x1="100" y1="110" x2="100" y2="142" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="82" y1="142" x2="118" y2="142" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Liquid Wave Inside Glass -->
  <path d="M78 80 Q100 88 122 80 L100 110 Z" fill="url(#amberGrad)" opacity="0.85" />
  
  <!-- Garnish Olive / Star Diamond -->
  <circle cx="120" cy="64" r="5" fill="#f59e0b" />
  <line x1="90" y1="95" x2="126" y2="58" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- Stars -->
  <polygon points="100,28 103,36 111,36 105,41 107,49 100,44 93,49 95,41 89,36 97,36" fill="url(#amberGrad)" />
</svg>
